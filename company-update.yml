name: Add or correct a company
description: Tell us about a company that's missing from the map, has moved, or is listed incorrectly.
title: "[Company] "
labels: ["company-data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the Wynwood map accurate. You don't need to know JSON or git to fill this out, just the basics below. If you'd rather edit `companies.json` directly, you're welcome to open a pull request instead.

  - type: dropdown
    id: change-type
    attributes:
      label: What kind of update is this?
      options:
        - Add a new company
        - Correct an existing company's info
        - Remove a company (closed, moved away, etc.)
        - Confirm an unverified company's address
    validations:
      required: true

  - type: input
    id: company-name
    attributes:
      label: Company name
      placeholder: "e.g. Acme Robotics"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick the closest fit. Open a separate issue first if you think a new category is needed.
      options:
        - Tech
        - VC
        - Finance
        - Media
        - Coworking
        - Legal
        - Not sure
    validations:
      required: true

  - type: input
    id: address
    attributes:
      label: Wynwood street address
      description: Leave blank if you don't have a confirmed address — that's fine, it'll just be listed as unverified.
      placeholder: "e.g. 215 NW 24th St, Miami FL 33127"
    validations:
      required: false

  - type: input
    id: domain
    attributes:
      label: Company website
      placeholder: "e.g. acmerobotics.com"
    validations:
      required: false

  - type: textarea
    id: source
    attributes:
      label: How do you know this?
      description: A link, a news article, personal knowledge of the company, anything that helps us verify it.
      placeholder: "e.g. I work there / saw their sign / read about it in [link]"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Valuation, funding, when they moved in, or any other detail worth including.
    validations:
      required: false
