<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wynwood Tech Map</title>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#f5f5f0;color:#1a1a1a;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column}
#topbar{height:52px;background:#fff;border-bottom:1px solid #e0ddd6;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex-shrink:0;gap:10px;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,0.06)}

/* LAB ECOSYSTEM BAR */
#lab-bar{height:38px;background:#f0fdf8;border-bottom:1px solid #b2eadc;display:flex;align-items:center;padding:0 18px;flex-shrink:0;gap:12px;z-index:9;cursor:pointer;user-select:none;transition:background 0.15s}
#lab-bar:hover{background:#e0f7f0}
#lab-bar-logo{width:20px;height:20px;object-fit:contain;border-radius:3px;flex-shrink:0}
#lab-bar-label{font-family:monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#00b89c;font-weight:700}
#lab-bar-sub{font-size:11px;color:#555;flex:1}
#lab-bar-count{font-family:monospace;font-size:10px;color:#00b89c;background:rgba(0,184,156,0.1);padding:2px 8px;border-radius:20px}
#lab-bar-arrow{font-size:10px;color:#00b89c;transition:transform 0.3s}
#lab-bar.open #lab-bar-arrow{transform:rotate(180deg)}

/* LAB ECOSYSTEM PANEL */
#lab-panel{background:#fff;border-bottom:1px solid #e0ddd6;overflow:hidden;max-height:0;transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1);flex-shrink:0;z-index:8}
#lab-panel.open{max-height:260px}
#lab-panel-inner{padding:14px 18px 16px;display:flex;gap:20px}
.lab-col{flex:1;min-width:0}
.lab-col-header{font-family:monospace;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:#00b89c;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #e0f7f0;display:flex;align-items:center;gap:6px}
.lab-col-header span{background:rgba(0,184,156,0.1);color:#00b89c;font-size:8px;padding:1px 6px;border-radius:10px}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:3px 8px;max-height:180px;overflow-y:auto;padding-right:4px}
.lab-grid::-webkit-scrollbar{width:3px}
.lab-grid::-webkit-scrollbar-thumb{background:#b2eadc;border-radius:2px}
.lab-co{font-size:11px;color:#333;padding:3px 6px;border-radius:3px;transition:background 0.12s;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.lab-co:hover{background:#f0fdf8;color:#00b89c}
.lab-co-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:#00b89c;opacity:0.5}

/* HIGHLIGHTED MEMBERS STRIP */
#highlight-bar{background:#fff;border-bottom:1px solid #e0ddd6;padding:12px 18px;display:flex;align-items:center;gap:18px;flex-shrink:0;z-index:7;overflow-x:auto}
#highlight-bar::-webkit-scrollbar{height:0px}
#highlight-list{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.hl-label{font-family:monospace;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#aaa;flex-shrink:0;white-space:nowrap}
.hl-item{display:flex;align-items:center;gap:8px;flex-shrink:0;padding:5px 12px 5px 5px;border-radius:30px;border:1px solid #f0ece3;transition:border-color 0.15s,background 0.15s;cursor:default}
.hl-item:hover{border-color:#00b89c;background:#f0fdf8}
.hl-logo-wrap{width:30px;height:30px;border-radius:50%;border:1px solid #eee;background:#fafafa;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.hl-logo{width:18px;height:18px;object-fit:contain}
.hl-fb{width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center;font-family:monospace;font-size:8px;font-weight:700;color:#fff;background:#00b89c}
.hl-name{font-size:12px;font-weight:600;color:#1a1a1a;white-space:nowrap}
.hl-tag{font-family:monospace;font-size:8px;letter-spacing:0.1em;text-transform:uppercase;color:#00b89c;white-space:nowrap}
.logo{font-family:monospace;font-size:14px;font-weight:700;color:#1a1a1a;letter-spacing:0.1em;white-space:nowrap}.logo span{color:#00b89c}
.filters{display:flex;gap:5px;flex-wrap:wrap}
.fbtn{font-family:monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;border:1px solid #d0cdc6;background:#fff;color:#888;cursor:pointer;border-radius:3px;transition:all 0.15s}
.fbtn:hover{border-color:#1a1a1a;color:#1a1a1a}.fbtn.active{border-color:#1a1a1a;color:#fff;background:#1a1a1a}
.count{font-family:monospace;font-size:10px;color:#aaa;white-space:nowrap}.count b{color:#00b89c}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#map{flex:1;position:relative}
#view-toggle{position:absolute;top:12px;left:12px;z-index:5;display:flex;box-shadow:0 2px 8px rgba(0,0,0,0.12)}
.vtbtn{font-family:monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:6px 13px;border:1px solid #d0cdc6;background:#fff;color:#888;cursor:pointer;transition:all 0.15s}
.vtbtn:first-child{border-right:none}.vtbtn:hover{color:#1a1a1a}.vtbtn.active{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
#unverified-toggle{position:absolute;top:12px;right:12px;z-index:10;font-family:monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:6px 14px;border:1px solid #c8a000;background:#fff;color:#a07800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.08);display:flex;align-items:center;gap:7px;transition:all 0.2s}
#unverified-toggle:hover{background:#fffbee}
#unverified-toggle .arrow{transition:transform 0.3s;font-size:8px}
#unverified-toggle.open .arrow{transform:rotate(180deg)}
#unverified-panel{position:absolute;top:48px;right:12px;z-index:9;width:240px;background:#fff;border:1px solid #e8d580;box-shadow:0 4px 16px rgba(0,0,0,0.1);overflow:hidden;max-height:0;transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1)}
#unverified-panel.open{max-height:560px}
.up-header{padding:10px 13px 7px;border-bottom:1px solid #f0e8b0;background:#fffdf0}
.up-title{font-family:monospace;font-size:8px;letter-spacing:0.22em;text-transform:uppercase;color:#a07800}
.up-sub{font-family:monospace;font-size:8px;color:#bbb;margin-top:2px}
.up-list{padding:4px 0;max-height:440px;overflow-y:auto}
.up-list::-webkit-scrollbar{width:3px}.up-list::-webkit-scrollbar-thumb{background:#e0ddd6;border-radius:2px}
.up-item{padding:7px 12px;font-size:11px;color:#666;border-left:2px solid transparent;display:flex;align-items:center;gap:9px;transition:all 0.12s;cursor:pointer}
.up-item:hover{background:#fffdf0;border-left-color:#c8a000;color:#333}
.up-logo{width:18px;height:18px;object-fit:contain;border-radius:3px;flex-shrink:0;border:1px solid #eee;background:#fafafa}
.up-fb{width:18px;height:18px;border-radius:3px;flex-shrink:0;display:none;align-items:center;justify-content:center;font-family:monospace;font-size:8px;font-weight:700;color:#fff;background:#c8a000}
.up-name{font-size:11px;color:#555;font-weight:500}
#sidebar{width:250px;background:#fff;border-left:1px solid #e0ddd6;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sh{padding:13px 15px 10px;border-bottom:1px solid #e0ddd6;background:#fafaf7}
.sh-t{font-family:monospace;font-size:12px;font-weight:700;color:#1a1a1a;letter-spacing:0.04em}
.sh-s{font-family:monospace;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:#aaa;margin-top:2px}
#clist{flex:1;overflow-y:auto}
#clist::-webkit-scrollbar{width:3px}#clist::-webkit-scrollbar-thumb{background:#e0ddd6;border-radius:2px}
.ci{padding:9px 15px;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:10px;transition:all 0.12s;border-bottom:1px solid #f5f3ef}
.ci:hover{background:#fafaf7}.ci.active{background:#f0fdf8;border-left-color:#00b89c}
.ci-logo{width:22px;height:22px;object-fit:contain;border-radius:4px;flex-shrink:0;border:1px solid #eee;background:#fafafa}
.ci-fb{width:22px;height:22px;border-radius:4px;flex-shrink:0;display:none;align-items:center;justify-content:center;font-family:monospace;font-size:9px;font-weight:700;color:#fff}
.cn{font-size:12px;font-weight:500;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc{font-family:monospace;font-size:9px;letter-spacing:0.06em;text-transform:uppercase;color:#aaa;margin-top:1px}
.marker-anchor{width:0;height:0;position:relative;overflow:visible}
.solo-logo{width:32px;height:32px;position:absolute;top:-16px;left:-16px;border-radius:50%;border:2.5px solid #fff;cursor:pointer;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.25);transition:box-shadow 0.15s,border-color 0.15s}
.solo-logo:hover{box-shadow:0 3px 14px rgba(0,0,0,0.35);border-color:#00b89c}
.solo-logo.active-pin{border-color:#00b89c;box-shadow:0 0 0 4px rgba(0,184,156,0.22),0 3px 14px rgba(0,0,0,0.25)}
.solo-logo img{width:22px;height:22px;object-fit:contain;display:block;pointer-events:none}
.solo-logo .fb{width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;font-family:monospace;font-size:10px;font-weight:700;color:#fff;pointer-events:none}
.cluster-btn{width:36px;height:36px;position:absolute;top:-18px;left:-18px;border-radius:50%;background:#1a1a1a;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);transition:box-shadow 0.15s,background 0.15s;z-index:2}
.cluster-btn:hover{background:#00b89c;box-shadow:0 3px 14px rgba(0,184,156,0.4)}
.cluster-plus{color:#fff;font-size:20px;font-weight:300;line-height:1;user-select:none;pointer-events:none;margin-top:-1px}
.cluster-count{position:absolute;top:-5px;right:-5px;background:#00b89c;color:#fff;font-family:monospace;font-size:8px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;pointer-events:none;z-index:3}
.cluster-child{width:30px;height:30px;position:absolute;border-radius:50%;background:#fff;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.22);display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;transform:scale(0.3);transition:opacity 0.18s ease,transform 0.18s ease;pointer-events:none;cursor:pointer;z-index:4}
.cluster-child.expanded{opacity:1;transform:scale(1);pointer-events:all}
.cluster-child:hover{border-color:#00b89c;box-shadow:0 3px 12px rgba(0,184,156,0.45);z-index:10}
.cluster-child img{width:20px;height:20px;object-fit:contain;pointer-events:none}
.cluster-child .cfb{width:20px;height:20px;border-radius:50%;display:none;align-items:center;justify-content:center;font-family:monospace;font-size:9px;font-weight:700;color:#fff;pointer-events:none}
#tip{position:fixed;background:#fff;border:1px solid #e0ddd6;box-shadow:0 4px 14px rgba(0,0,0,0.12);padding:7px 11px;pointer-events:none;z-index:9999;display:none;white-space:nowrap;transform:translate(16px,-50%)}
#tip .tip-name{font-size:12px;font-weight:600;color:#1a1a1a}
#tip .tip-cat{font-family:monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;margin-top:2px}
.maplibregl-popup-content{background:#fff !important;border:1px solid #e0ddd6 !important;border-radius:0 !important;padding:0 !important;box-shadow:0 8px 28px rgba(0,0,0,0.12) !important;font-family:'DM Sans',system-ui,sans-serif !important;min-width:210px}
.maplibregl-popup-tip{border-top-color:#fff !important;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15)) !important}
.maplibregl-popup-close-button{color:#aaa !important;font-size:14px !important;padding:5px 8px !important}
.maplibregl-popup-close-button:hover{color:#333 !important;background:transparent !important}
.popup-inner{padding:14px 16px}
.popup-logo-wrap{width:38px;height:38px;border:1px solid #eee;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:9px;background:#fafafa}
.popup-logo{width:28px;height:28px;object-fit:contain}
.popup-cat{font-family:monospace;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:4px}
.popup-name{font-size:15px;font-weight:700;color:#1a1a1a;line-height:1.2;margin-bottom:5px}
.popup-addr{font-size:11px;color:#999;line-height:1.6}
.popup-unverified-badge{display:inline-block;font-family:monospace;font-size:8px;letter-spacing:0.15em;text-transform:uppercase;color:#a07800;background:#fffdf0;border:1px solid #e8d580;padding:2px 6px;margin-bottom:8px}
.popup-stats{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;border-top:1px solid #f0ece3;padding-top:10px}
.stat-block{display:flex;flex-direction:column;gap:1px}
.stat-label{font-family:monospace;font-size:7px;letter-spacing:0.18em;text-transform:uppercase;color:#aaa}
.stat-value{font-size:11px;font-weight:600;color:#1a1a1a;line-height:1.4}
.stat-traded-yes{color:#00b89c}.stat-traded-no{color:#f57c00}
.stat-full{grid-column:1/-1}
.maplibregl-ctrl-group{background:#fff !important;border:1px solid #e0ddd6 !important;box-shadow:0 2px 8px rgba(0,0,0,0.1) !important}
.maplibregl-ctrl-group button{background:#fff !important}
.maplibregl-ctrl-attrib{background:rgba(255,255,255,0.85) !important}
.maplibregl-ctrl-attrib a{color:#aaa !important}
</style>
</head>
<body>
<div id="topbar">
  <div class="logo">MIAMI TECH <span>DISTRICT</span> &nbsp;// MAP</div>
  <div class="filters">
    <button class="fbtn active" data-c="All">All</button>
    <button class="fbtn" data-c="Tech">Tech</button>
    <button class="fbtn" data-c="VC">VC</button>
    <button class="fbtn" data-c="Finance">Finance</button>
    <button class="fbtn" data-c="Media">Media</button>
    <button class="fbtn" data-c="Coworking">Coworking</button>
    <button class="fbtn" data-c="Legal">Legal</button>
  </div>
  <div class="count">Showing <b id="vc">33</b> verified locations</div>
</div>

<!-- LAB ECOSYSTEM BAR -->
<div id="lab-bar" onclick="toggleLabPanel()">
  <img id="lab-bar-logo" src="https://www.google.com/s2/favicons?domain=thelabmiami.com&sz=64" alt="The LAB" onerror="this.style.display='none'"/>
  <div id="lab-bar-label">The LAB Miami Ecosystem</div>
  <div id="lab-bar-sub">74 companies across The Dock &amp; The LAB building</div>
  <div id="lab-bar-count">74 companies</div>
  <div id="lab-bar-arrow">▼</div>
</div>

<!-- LAB ECOSYSTEM PANEL -->
<div id="lab-panel">
  <div id="lab-panel-inner">
    <div class="lab-col">
      <div class="lab-col-header">// The Dock <span>44</span></div>
      <div class="lab-grid" id="dock-grid"></div>
    </div>
    <div class="lab-col">
      <div class="lab-col-header">// The LAB Building <span>30</span></div>
      <div class="lab-grid" id="lab-grid"></div>
    </div>
  </div>
</div>

<!-- HIGHLIGHTED MEMBERS STRIP -->
<div id="highlight-bar">
  <div class="hl-label">// Highlighted Members</div>
  <div id="highlight-list"></div>
</div>

<div id="main">
  <div id="map">
    <div id="view-toggle">
      <button class="vtbtn" id="btn-street">Street</button>
      <button class="vtbtn active" id="btn-satellite">Satellite 3D</button>
    </div>
    <button id="unverified-toggle" onclick="toggleUnverified()">
      <span>Unverified (3)</span><span class="arrow">▼</span>
    </button>
    <div id="unverified-panel">
      <div class="up-header">
        <div class="up-title">// Unverified Locations</div>
        <div class="up-sub">Click any company to see details</div>
      </div>
      <div class="up-list" id="up-list"></div>
    </div>
  </div>
  <div id="sidebar">
    <div class="sh"><div class="sh-t">Tech Companies</div><div class="sh-s">// Wynwood Verified</div></div>
    <div id="clist"></div>
  </div>
</div>
<div id="tip"><div class="tip-name" id="tip-name"></div><div class="tip-cat" id="tip-cat"></div></div>

// ── DIAGNOSTIC SYSTEM ──
// Intercepts actual MapTiler network requests so we capture real HTTP status
// codes (401/403/429/etc) rather than guessing from error message text.
const diagLog=[];
const origFetch=window.fetch;
window.fetch=function(...args){
  const url=args[0]instanceof Request?args[0].url:args[0];
  const isMapTiler=typeof url==='string'&&url.includes('maptiler.com');
  const p=origFetch.apply(this,args);
  if(isMapTiler){
    p.then(res=>{
      if(!res.ok){
        diagLog.push({url,status:res.status,statusText:res.statusText,time:Date.now()});
        if(diagLog.length>20)diagLog.shift();
        maybeShowDiagnostic();
      }
    }).catch(err=>{
      diagLog.push({url,status:0,statusText:err.message||'Network error (blocked/offline)',time:Date.now()});
      if(diagLog.length>20)diagLog.shift();
      maybeShowDiagnostic();
    });
  }
  return p;
};

function diagnosisFor(status,statusText,url){
  if(status===401){
    return{
      title:'Key Rejected (401 Unauthorized)',
      detail:'MapTiler is rejecting this API key outright. This usually means the key was deleted or regenerated in your MapTiler account since this file was last opened. Go to cloud.maptiler.com/account/keys and confirm this exact key still appears in your active list.'
    };
  }
  if(status===403){
    return{
      title:'Forbidden (403)',
      detail:"The key is valid but MapTiler is blocking this specific request. Likely cause: an allowed-domain restriction on the key that does not match how this file is being opened (file:// vs http://). Check the key's \"Allowed URLs\" / domain restriction settings in your MapTiler dashboard."
    };
  }
  if(status===429){
    return{
      title:'Rate Limited (429)',
      detail:'Too many requests were sent to MapTiler in a short window and it is temporarily throttling this key. This usually clears on its own within a few minutes, or means the monthly free tile quota has been reached.'
    };
  }
  if(status===0){
    return{
      title:'Network Request Blocked',
      detail:"The browser could not even reach MapTiler's servers ("+statusText+"). This points to something on your machine or network blocking the request — a browser extension (ad blocker, privacy extension), antivirus web shield, or a network-level content filter. Try opening this same file in an Incognito window with extensions disabled, or on a different network (phone hotspot), to confirm."
    };
  }
  if(status>=500){
    return{
      title:'MapTiler Server Error ('+status+')',
      detail:"MapTiler's servers returned an error unrelated to your key or account. This is on their end — check status.maptiler.com for an active incident."
    };
  }
  return{
    title:'Tile Request Failed ('+status+' '+statusText+')',
    detail:'An unexpected response was returned for a MapTiler resource. Check the Network tab in DevTools (F12) for the full request URL and response body for more detail.'
  };
}

let diagnosticShown=false;
function maybeShowDiagnostic(){
  if(diagnosticShown)return;
  // Wait briefly to collect a representative sample of failures before deciding
  setTimeout(()=>{
    if(diagLog.length===0)return;
    diagnosticShown=true;
    const latest=diagLog[diagLog.length-1];
    const diag=diagnosisFor(latest.status,latest.statusText,latest.url);
    showDiagnosticBanner(diag,latest);
  },1200);
}

function showDiagnosticBanner(diag,sample){
  let banner=document.getElementById('map-error-banner');
  if(banner)banner.remove();
  banner=document.createElement('div');
  banner.id='map-error-banner';
  banner.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid #e53935;border-radius:8px;padding:18px 22px;max-width:380px;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,0.25);font-family:system-ui,sans-serif';
  const failCount=diagLog.length;
  banner.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div style="width:8px;height:8px;border-radius:50%;background:#e53935;flex-shrink:0"></div>
      <div style="font-weight:700;color:#e53935;font-size:14px">Map Tiles Not Loading</div>
    </div>
    <div style="font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:6px">${diag.title}</div>
    <div style="font-size:12px;color:#555;line-height:1.6;margin-bottom:10px">${diag.detail}</div>
    <div style="font-size:10px;font-family:monospace;color:#999;background:#f7f7f5;padding:8px 10px;border-radius:4px;word-break:break-all;line-height:1.5">
      Status: ${sample.status} ${sample.statusText}<br/>
      Failed requests: ${failCount}<br/>
      Key (first 12 chars): ${MAPTILER_KEY.slice(0,12)}...<br/>
      Sample URL: ${sample.url.split('?')[0]}
    </div>
    <button onclick="document.getElementById('map-error-banner').remove()" style="margin-top:12px;font-family:monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:6px 14px;border:1px solid #d0cdc6;background:#fff;color:#666;cursor:pointer;border-radius:4px">Dismiss</button>
  `;
  document.getElementById('map').appendChild(banner);
}

  map.addSource('wynwood',{type:'geojson',data:{type:'Feature',geometry:{type:'Polygon',
    coordinates:[[[-80.2090,25.8035],[-80.1910,25.8035],[-80.1910,25.7890],[-80.2090,25.7890],[-80.2090,25.8035]]]

function addBuildingLayers(){
  // In 3D satellite mode: add an ambient 3D buildings layer using MapTiler's
  // OpenMapTiles vector data (separate vector source added on top of the
  // satellite/hybrid raster base) — this renders real building geometry
  // for every building in the area, same effect as before.
  if(currentStyle==='satellite'){
    if(!map.getSource('openmaptiles')){
      map.addSource('openmaptiles',{
        type:'vector',
        url:`https://api.maptiler.com/tiles/v3/tiles.json?key=${MAPTILER_KEY}`
      });
    }
    if(!map.getLayer('all-3d-buildings')){
      map.addLayer({
        id:'all-3d-buildings',
        source:'openmaptiles',
        'source-layer':'building',
        type:'fill-extrusion',
        minzoom:14,
        paint:{
          'fill-extrusion-color':'#c8bfb0',
          'fill-extrusion-height':['interpolate',['linear'],['zoom'],14,0,14.05,['get','render_height']],
          'fill-extrusion-base':['interpolate',['linear'],['zoom'],14,0,14.05,['coalesce',['get','render_min_height'],0]],
          'fill-extrusion-opacity':0.65,
        }
      });
    }
  }

  // Company highlight overlays — tighter footprints strictly inside blocks
  companyBuildings.forEach(b=>{
    ['fill','extrude','outline'].forEach(s=>{if(map.getLayer(`${b.id}-${s}`))map.removeLayer(`${b.id}-${s}`);});
    if(map.getSource(b.id))map.removeSource(b.id);
    map.addSource(b.id,{type:'geojson',data:{
      type:'Feature',
      properties:{height:b.height},
      geometry:{type:'Polygon',coordinates:[b.coords]}
    }});
    if(currentStyle==='satellite'){
      // Colored extrusion sits on top of the real building, tinted per company
      map.addLayer({
        id:`${b.id}-extrude`,
        type:'fill-extrusion',
        source:b.id,
        paint:{
          'fill-extrusion-color':b.color,
          'fill-extrusion-height':b.height,
          'fill-extrusion-base':0,
          'fill-extrusion-opacity':0.8,
          'fill-extrusion-vertical-gradient':true,
        }
      });
      map.addLayer({
        id:`${b.id}-outline`,
        type:'line',source:b.id,
        paint:{'line-color':'rgba(255,255,255,0.9)','line-width':1.2,'line-opacity':0.9}
      });
    } else {
      map.addLayer({id:`${b.id}-fill`,type:'fill',source:b.id,paint:{'fill-color':b.color,'fill-opacity':0.20}});
      map.addLayer({id:`${b.id}-outline`,type:'line',source:b.id,paint:{'line-color':b.color,'line-width':2,'line-opacity':0.85}});
    }
  });
}

        anchor.appendChild(child);children.push(child);markerData[co.idx]={el:child,co};
      });
      let locked=false,hovered=false;
      function expand(){if(hovered)return;hovered=true;children.forEach(c=>c.classList.add('expanded'));}
      function collapse(e){if(locked)return;if(anchor.contains(e.relatedTarget))return;hovered=false;children.forEach(c=>c.classList.remove('expanded'));hideTip();}
      btn.addEventListener('click',e=>{e.stopPropagation();hideTip();locked=!locked;if(locked){plus.textContent='×';children.forEach(c=>c.classList.add('expanded'));}else{plus.textContent='+';if(!hovered)children.forEach(c=>c.classList.remove('expanded'));}});
      btn.addEventListener('mouseenter',expand);btn.addEventListener('mouseleave',collapse);
      children.forEach(c=>{c.addEventListener('mouseenter',expand);c.addEventListener('mouseleave',collapse);});
      map.on('click',()=>{if(locked){locked=false;hovered=false;plus.textContent='+';children.forEach(c=>c.classList.remove('expanded'));}});
    } else {
      const co=cos[0];const color=COLORS[co.cat];
      const solo=document.createElement('div');solo.className='solo-logo';
      const img=document.createElement('img');img.src=logo(co.domain,co.name);img.alt=co.name;
      const fb=document.createElement('div');fb.className='fb';fb.style.background=color;fb.textContent=co.name.charAt(0);
      img.addEventListener('error',()=>{img.style.display='none';fb.style.display='flex';});
      solo.appendChild(img);solo.appendChild(fb);anchor.appendChild(solo);
      solo.addEventListener('mouseenter',e=>showTip(e,co.name,co.cat,color));
      solo.addEventListener('mousemove',e=>moveTip(e));
      solo.addEventListener('mouseleave',()=>hideTip());
      solo.addEventListener('click',e=>{e.stopPropagation();openPopup(co,[co.lng,co.lat],solo);});
      markerData[co.idx]={el:solo,co};allMarkerWraps.push({anchor,cos:[co],addr});
    }
    new maplibregl.Marker({element:anchor,anchor:'center'}).setLngLat([ctr.lng,ctr.lat]).addTo(map);
    if(isCluster)allMarkerWraps.push({anchor,cos,addr});
  });
  buildSidebar('All');
});

map.on('click',()=>{
  if(activePopup){activePopup.remove();activePopup=null;}
  if(activePinEl){activePinEl.classList&&activePinEl.classList.remove('active-pin');activePinEl=null;}
  document.querySelectorAll('.ci').forEach(c=>c.classList.remove('active'));
  hideTip();
});

function buildSidebar(filter){
  const list=document.getElementById('clist');list.innerHTML='';let count=0;
  companies.forEach((co,i)=>{
    if(filter!=='All'&&co.cat!==filter)return;count++;
    const color=COLORS[co.cat];
    const div=document.createElement('div');div.className='ci';div.dataset.i=i;
    const li=document.createElement('img');li.className='ci-logo';li.src=logo(co.domain,co.name);li.alt=co.name;
    const fb=document.createElement('div');fb.className='ci-fb';fb.style.background=color;fb.textContent=co.name.charAt(0);
    li.addEventListener('error',()=>{li.style.display='none';fb.style.display='flex';});
    const info=document.createElement('div');
    info.innerHTML=`<div class="cn">${co.name}</div><div class="cc" style="color:${color}">${co.cat}</div>`;
    div.appendChild(li);div.appendChild(fb);div.appendChild(info);
    div.addEventListener('click',()=>{const md=markerData[i];if(!md)return;openPopup(co,[co.lng,co.lat],md.el);});
    list.appendChild(div);
  });
  document.getElementById('vc').textContent=count;
}

document.querySelectorAll('.fbtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');const f=btn.dataset.c;
    if(activePopup){activePopup.remove();activePopup=null;}
    if(activePinEl){activePinEl.classList&&activePinEl.classList.remove('active-pin');activePinEl=null;}
    hideTip();
    allMarkerWraps.forEach(({anchor,cos})=>{anchor.style.display=(f==='All'||cos.some(c=>c.cat===f))?'':'none';});
    buildSidebar(f);
  });
});
